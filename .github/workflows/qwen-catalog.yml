name: Qwen public catalog snapshot
on:
  workflow_dispatch:
  push:
    branches: ['research/**']
    paths:
      - 'tools/discover_qwen_models.py'
      - 'tests/test_discover_qwen_models.py'
      - '.github/workflows/qwen-catalog.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test pagination logic (offline)
        run: python -m unittest discover -s tests -p 'test_discover_qwen_models.py' -v
      - name: Query official Qwen public Hub organization (metadata only)
        run: python tools/discover_qwen_models.py --online --page-size 100 --max-pages 30 --output build/qwen-official-inventory.json
      - name: Publish inventory metadata artifact (no weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-official-inventory
          path: build/qwen-official-inventory.json
          if-no-files-found: warn
          retention-days: 30
