name: Qwen public catalog snapshot
on:
  workflow_dispatch:
  push:
    branches: ['research/**']
    paths:
      - 'tools/discover_qwen_models.py'
      - 'tests/test_discover_qwen_models.py'
      - '.github/workflows/qwen-catalog.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test pagination logic (offline)
        run: python -m unittest discover -s tests -p 'test_discover_qwen_models.py' -v
      - name: Query official Qwen public Hub organization (metadata only)
        run: python tools/discover_qwen_models.py --online --page-size 100 --max-pages 30 --output build/qwen-official-inventory.json
      - name: Publish inventory metadata artifact (no weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-official-inventory
          path: build/qwen-official-inventory.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist complete public model inventory to research branch
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/research/')
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/qwen-official-inventory.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          if not x["complete"] or x["model_count"] < 1:
              raise SystemExit("Refusing to commit partial or empty Qwen catalog")
          Path("catalog").mkdir(exist_ok=True)
          Path("catalog/qwen-official-inventory.json").write_bytes(p.read_bytes())
          print(f"Complete public Qwen model manifest: {x['model_count']} entries")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/qwen-official-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh complete official Qwen model inventory [skip ci]"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
